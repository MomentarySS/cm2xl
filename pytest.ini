[pytest]
# tests/phase8_smoke.py 的文件名不匹配 pytest 默认的 test_*.py / *_test.py，而仓库里
# 一直没有 pytest 配置文件覆盖这个模式 —— 结果是 `pytest tests` 收集到 0 个测试：
# 那 42 个用例（配置迁移 / 原子写 / 文件锁 / 降级导出 / crash 日志 / toolbox 全局设置 /
# 日志级别切换）静默不跑，裸跑 pytest 会给出虚假的覆盖感。
#
# 注意 python_files 是整体替换：必须把默认的两个模式一起写回来，
# 否则 test_*.py 会被一并关掉。
python_files = test_*.py *_test.py phase8_smoke.py

# 限定收集范围。不加这一行，裸跑 pytest 会从当前目录递归扫描，而本仓库的
# dist/ 与 build/ 就在工作区里 —— 打包进来的第三方 test_*.py 将来可能被误收集。
testpaths = tests modules
